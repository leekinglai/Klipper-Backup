[temperature_sensor IDM]
sensor_type: temperature_mcu
sensor_mcu: idm
min_temp: 5
max_temp: 105

[temperature_sensor Spider_Board]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 70

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host
sensor_path: /sys/class/thermal/thermal_zone0/temp
min_temp: 0
max_temp: 70

[temperature_sensor Chamber]              # 箱内温度（需要增加一颗温感）
sensor_type: PT1000
sensor_pin: PC1	#T1				# 修改对应PIN（必填）
min_temp: 0
max_temp: 65

[temperature_sensor Electronic]
sensor_type: PT1000      #热敏电阻类型
sensor_pin: PC2 #T2                   # 修改对应PIN（必填）
min_temp: 0
max_temp: 60

